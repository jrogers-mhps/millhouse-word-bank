<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Writing Word Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brick:#a2492f; --brick-hi:#c05f3f; --brick-lo:#7d381f;
  --mortar:#efe6d3; --mortarline:#d9c9a8;
  --ink:#2e2618; --sub:#75674f; --accent:#436f56; --accent-hi:#57937a; --gold:#c99a3c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brick:#b8543a; --brick-hi:#d06e4c; --brick-lo:#8a3f27;
    --mortar:#20190f; --mortarline:#382c1a;
    --ink:#f1e9d8; --sub:#c2b393; --accent:#5a9a7c; --accent-hi:#71b593; --gold:#dcb35c;
  }
}
:root[data-theme="dark"]{
  --brick:#b8543a; --brick-hi:#d06e4c; --brick-lo:#8a3f27;
  --mortar:#20190f; --mortarline:#382c1a;
  --ink:#f1e9d8; --sub:#c2b393; --accent:#5a9a7c; --accent-hi:#71b593; --gold:#dcb35c;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--mortar);color:var(--ink);font-family:'Quicksand',system-ui,sans-serif;
  background-image:
    repeating-linear-gradient(0deg, var(--mortarline) 0 2px, transparent 2px 42px),
    repeating-linear-gradient(90deg, var(--mortarline) 0 2px, transparent 2px 84px);
  min-height:100vh;
}
h1,h2{font-family:'Bitter',Georgia,serif;}
header{position:sticky;top:0;background:var(--mortar);padding:14px 16px 10px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:2px solid var(--mortarline);z-index:5;}
.title{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;}
.title h1{margin:0;font-size:1.6rem;font-weight:800;color:var(--brick-lo);}
.crumbs{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:1rem;font-weight:600;color:var(--sub);}
.crumbs button{background:none;border:none;font:inherit;font-weight:700;color:var(--accent);cursor:pointer;padding:3px 6px;border-radius:5px;}
.crumbs button:hover{background:var(--mortarline);}
.crumbs .sep{opacity:.55;}
main{max-width:960px;margin:0 auto;padding:18px 14px 40px;}
.intro{color:var(--sub);font-size:1.1rem;margin:0 0 18px;font-weight:600;}
.search{width:100%;max-width:380px;display:block;margin:0 auto 20px;font-family:inherit;font-weight:600;font-size:1.1rem;padding:11px 16px;border-radius:10px;border:2px solid var(--mortarline);background:var(--mortar);color:var(--ink);}

.wall{display:flex;flex-direction:column;align-items:center;gap:12px;}
.wall-row{display:flex;gap:12px;}
.brick{
  --w:190px;
  width:var(--w); min-height:88px;
  background:linear-gradient(180deg,var(--bhi,var(--brick-hi)),var(--blo,var(--brick)));
  border-radius:8px; border:none; cursor:pointer;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.18), 0 3px 5px rgba(0,0,0,.18);
  color:#fff; font-family:'Quicksand',sans-serif; font-weight:700; font-size:1.2rem; line-height:1.25;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:12px 10px;
  transform:scale(.85); opacity:0; animation:lay .35s ease forwards;
  transition:transform .15s ease, box-shadow .15s ease;
}
.brick:hover{transform:translateY(-3px); box-shadow:inset 0 -4px 0 rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.18), 0 7px 11px rgba(0,0,0,.22);}
.brick:active{transform:translateY(0) scale(.98);}
.brick.stage{--w:200px; min-height:104px; font-size:1.4rem;}
.brick .stagesub{display:block;font-weight:500;font-size:.85rem;opacity:.85;margin-top:4px;}
@keyframes lay{ to{ transform:scale(1); opacity:1; } }

.tile{
  --w:auto;
  background:var(--mortar); color:var(--ink); border:2px solid var(--mortarline);
  border-radius:9px; padding:12px 18px; font-weight:600; font-size:1.25rem;
  transform:scale(.85); opacity:0; animation:lay .3s ease forwards;
  min-height:auto; box-shadow:none; cursor:default;
}
.tile.phrase{width:100%; text-align:left; font-style:italic; font-weight:600;}
.tilewrap{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:760px; margin:0 auto;}
.tilewrap.phrases{flex-direction:column; align-items:stretch;}

.card{max-width:760px;margin:0 auto;}
.classname{text-align:center;color:var(--sub);font-weight:700;margin-bottom:14px;font-size:1.05rem;}
.empty{text-align:center;color:var(--sub);font-weight:600;padding:30px 10px;font-size:1.1rem;}

.conjbox{display:grid;grid-template-columns:1fr;gap:14px;max-width:680px;margin:0 auto;font-size:1.05rem;}
@media(min-width:640px){.conjbox{grid-template-columns:1fr 1fr;}}
.conjcard{background:var(--mortar);border:2px solid var(--mortarline);border-radius:10px;padding:16px 18px;}
.conjcard h3{margin:0 0 10px;font-size:1rem;font-family:'Quicksand';color:var(--accent);}
.conjcard .letter{font-weight:800;color:var(--brick-lo);}

footer{text-align:center;color:var(--sub);font-size:.78rem;padding:10px 20px 24px;font-weight:600;}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:20px;padding:8px 16px;font-family:'Quicksand';font-weight:700;font-size:.85rem;cursor:pointer;margin:0 0 16px;}
.backbtn:hover{background:var(--accent-hi);}

.tzlink{background:none;border:none;font:inherit;color:var(--sub);text-decoration:underline;cursor:pointer;padding:0;font-weight:700;}
.tzlink:hover{color:var(--accent);}
.tzoverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.tzbox{background:var(--mortar);border:2px solid var(--mortarline);border-radius:14px;padding:22px;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.3);}
.tzbox h2{margin:0 0 12px;font-size:1.15rem;color:var(--brick-lo);}
.tzbox label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 5px;color:var(--sub);}
.tzbox input, .tzbox select{width:100%;font-family:inherit;font-weight:600;font-size:1rem;padding:9px 12px;border-radius:9px;border:2px solid var(--mortarline);background:#fff0;color:var(--ink);}
.tzrow{display:flex;gap:10px;margin-top:18px;}
.tzbtn{flex:1;border:none;border-radius:10px;padding:10px;font-family:'Quicksand';font-weight:700;font-size:.95rem;cursor:pointer;}
.tzbtn.primary{background:var(--accent);color:#fff;}
.tzbtn.primary:hover{background:var(--accent-hi);}
.tzbtn.ghost{background:transparent;color:var(--sub);border:2px solid var(--mortarline);}
.tzmsg{margin-top:10px;font-weight:700;font-size:.88rem;}
.tzmsg.err{color:#b23a3a;}
.tzmsg.ok{color:var(--accent);}
</style>
</head>

const BASE_CLASSES = [
  ["nouns","Nouns"],["verbs","Verbs"],["adjectives","Adjectives"],["adverbs","Adverbs"],
  ["prepositions","Prepositions"],["similes","Similes"],["metaphors","Metaphors"],
  ["fronted","Fronted Adverbials"],["conjunctions","Conjunctions"]
];
const UKS2_EXTRA_CLASSES = [["determiners","Determiners"],["modalverbs","Modal Verbs"],["personification","Personification"]];
const CLASSES = BASE_CLASSES.concat(UKS2_EXTRA_CLASSES);
const CONJ = {
  fanboys:{title:"FANBOYS — coordinating conjunctions", items:[["F","for"],["A","and"],["N","nor"],["B","but"],["O","or"],["Y","yet"],["S","so"]]},
  awhitebus:{title:"A WHITE BUS — subordinating conjunctions", items:[["A","after, although, as"],["W","when, whenever, where, wherever, while"],["H","how, however"],["I","if, in case"],["T","though (and sometimes than)"],["E","even if, even though"],["B","because, before"],["U","unless, until"],["S","since, so that"]]}
};

let state = { view:'stage', stage:null, topic:null, cls:null, q:'' };

const PALETTE = [
  {hi:'#c9663f',lo:'#8a3f27'}, // terracotta
  {hi:'#d9ab48',lo:'#a67a26'}, // sandstone gold
  {hi:'#6b9a5c',lo:'#3f6236'}, // moss green
  {hi:'#5a7ba0',lo:'#35495f'}, // slate blue
  {hi:'#9c5a86',lo:'#613653'}, // plum
  {hi:'#c14f3a',lo:'#7c2e1f'}, // rust red
  {hi:'#489d94',lo:'#2a5f59'}, // teal
  {hi:'#d4a03a',lo:'#96691f'}, // mustard
  {hi:'#af4d70',lo:'#6d2b41'}, // berry
  {hi:'#5178a0',lo:'#2f4863'}  // denim
];
function paint(brick, i){ const c = PALETTE[i % PALETTE.length]; brick.style.setProperty('--bhi', c.hi); brick.style.setProperty('--blo', c.lo); }

function cols(){ const w = window.innerWidth; return w<480?2 : w<700?3 : w<1000?4:5; }

function buildWall(container, items, brickBuilder, opts){
  opts = opts || {};
  const c = cols();
  const wall = document.createElement('div'); wall.className='wall';
  let idx = 0;
  for(let i=0;i<items.length;i+=c){
    const row = items.slice(i,i+c);
    const rowEl = document.createElement('div'); rowEl.className='wall-row';
    const rowIdx = i/c;
    if(rowIdx % 2 === 1 && row.length === c) rowEl.style.marginLeft = 'calc(var(--w, 150px) / 2 + 4px)';
    row.forEach(item=>{
      const b = brickBuilder(item, idx);
      b.style.animationDelay = (idx*0.045)+'s';
      if(!opts.noColor) paint(b, idx);
      rowEl.appendChild(b);
      idx++;
    });
    wall.appendChild(rowEl);
  }
  container.appendChild(wall);
}

function crumbBtn(label, onClick){
  const b = document.createElement('button'); b.textContent = label; b.onclick = onClick; return b;
}
function renderCrumbs(){
  const el = document.getElementById('crumbs'); el.innerHTML='';
  el.appendChild(crumbBtn('Choose year group', ()=>{ state.view='stage'; state.stage=null; state.topic=null; state.cls=null; render(); }));
  if(state.stage!==null){
    const sep=document.createElement('span'); sep.className='sep'; sep.textContent='›'; el.appendChild(sep);
    el.appendChild(crumbBtn(STAGES[state.stage][0], ()=>{ state.view='topics'; state.topic=null; state.cls=null; render(); }));
  }
  if(state.topic){
    const sep=document.createElement('span'); sep.className='sep'; sep.textContent='›'; el.appendChild(sep);
    el.appendChild(crumbBtn(T[state.topic][0], ()=>{ state.view='classes'; state.cls=null; render(); }));
  }
  if(state.cls){
    const sep=document.createElement('span'); sep.className='sep'; sep.textContent='›'; el.appendChild(sep);
    const label = CLASSES.find(c=>c[0]===state.cls)[1];
    const cur = document.createElement('span'); cur.textContent=label; cur.style.color='var(--ink)'; cur.style.fontWeight='800';
    el.appendChild(cur);
  }
}

function render(){
  renderCrumbs();
  const main = document.getElementById('main');
  main.innerHTML = '';

  if(state.view==='stage'){
    const p = document.createElement('p'); p.className='intro'; p.textContent='Which year group are you building words for?';
    main.appendChild(p);
    buildWall(main, STAGES, ([code,desc])=>{
      const b = document.createElement('button'); b.className='brick stage';
      b.innerHTML = code+'<span class="stagesub">'+desc+'</span>';
      b.onclick = ()=>{ state.stage = STAGES.findIndex(s=>s[0]===code); state.view='topics'; render(); };
      return b;
    });
  }

  else if(state.view==='topics'){
    const p = document.createElement('p'); p.className='intro'; p.textContent='Pick a topic wall to build.';
    main.appendChild(p);
    const stageCode = STAGES[state.stage][0];
    const entries = Object.entries(T).filter(([slug])=> !TOPIC_ONLY_STAGE[slug] || TOPIC_ONLY_STAGE[slug]===stageCode);
    buildWall(main, entries, ([slug,[label]])=>{
      const b = document.createElement('button'); b.className='brick';
      b.textContent = label;
      b.onclick = ()=>{ state.topic=slug; state.view='classes'; render(); };
      return b;
    });
  }

  else if(state.view==='classes'){
    const p = document.createElement('p'); p.className='intro'; p.textContent='Which word class do you need?';
    main.appendChild(p);
    const stageCode = STAGES[state.stage][0];
    const classList = stageCode==='KS1' ? CLASSES.filter(([slug])=>KS1_CLASSES.has(slug))
                     : stageCode==='UKS2' ? CLASSES
                     : BASE_CLASSES;
    buildWall(main, classList, ([slug,label])=>{
      const b = document.createElement('button'); b.className='brick';
      b.textContent = label;
      b.onclick = ()=>{ state.cls=slug; state.q=''; state.view='words'; render(); };
      return b;
    });
  }

  else if(state.view==='words'){
    const card = document.createElement('div'); card.className='card';

    if(state.cls==='conjunctions' && STAGES[state.stage][0]!=='KS1'){
      const cn = document.createElement('div'); cn.className='classname'; cn.textContent='Same for every topic';
      card.appendChild(cn);
      const box = document.createElement('div'); box.className='conjbox';
      Object.values(CONJ).forEach(g=>{
        const c=document.createElement('div'); c.className='conjcard';
        c.innerHTML = '<h3>'+g.title+'</h3>' + g.items.map(([l,w])=>'<div><span class="letter">'+l+'</span> — '+w+'</div>').join('');
        box.appendChild(c);
      });
      card.appendChild(box);
      main.appendChild(card);
      return;
    }

    const search = document.createElement('input'); search.type='search'; search.className='search';
    search.placeholder='Search these words...'; search.value = state.q;
    search.oninput = e=>{ state.q = e.target.value.toLowerCase(); renderWordTiles(); };
    main.appendChild(search);
    main.appendChild(card);

    function renderWordTiles(){
      card.innerHTML = '';
      const data = T[state.topic][1][state.cls] || [];
      const filtered = data.filter(([w,tier])=> tier<=state.stage && (!state.q || w.toLowerCase().includes(state.q)));
      if(filtered.length===0){
        const e = document.createElement('div'); e.className='empty';
        e.textContent = 'No words yet at this level — try an older year group tab.';
        card.appendChild(e); return;
      }
      const isPhrase = state.cls==='similes' || state.cls==='metaphors' || state.cls==='fronted';
      const wrap = document.createElement('div'); wrap.className = 'tilewrap' + (isPhrase ? ' phrases':'');
      filtered.forEach(([w],i)=>{
        const t = document.createElement('div'); t.className='tile'+(isPhrase?' phrase':'');
        t.textContent = w;
        t.style.animationDelay = (i*0.04)+'s';
        wrap.appendChild(t);
      });
      card.appendChild(wrap);
    }
    renderWordTiles();
  }
}

let resizeT;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeT);
  resizeT = setTimeout(()=>{ if(state.view==='topics'||state.view==='classes') render(); }, 200);
});

// ---- Teacher Zone: fetch + merge teacher-added words, and the add-word panel ----
async function loadCustomWords(){
  try{
    const res = await fetch('/api/words');
    if(!res.ok) return;
    const rows = await res.json();
    for(const row of rows){
      const stageIdx = STAGES.findIndex(s=>s[0]===row.stage);
      if(stageIdx===-1 || !T[row.topic_slug]) continue;
      const classes = T[row.topic_slug][1];
      if(!classes[row.word_class]) classes[row.word_class] = [];
      const already = classes[row.word_class].some(([w])=>w.toLowerCase()===row.word.toLowerCase());
      if(!already) classes[row.word_class].push([row.word, stageIdx]);
    }
  } catch(e){ /* offline or function unavailable — the built-in word lists still work fine */ }
}

let tzPin = null;

function tzTopicOptions(stageCode){
  return Object.entries(T).filter(([slug])=> !TOPIC_ONLY_STAGE[slug] || TOPIC_ONLY_STAGE[slug]===stageCode);
}
function tzClassOptions(stageCode){
  return stageCode==='KS1' ? CLASSES.filter(([slug])=>KS1_CLASSES.has(slug))
       : stageCode==='UKS2' ? CLASSES
       : BASE_CLASSES;
}

function closeTeacherZone(){
  const ov = document.getElementById('tzOverlay');
  ov.style.display = 'none'; ov.innerHTML = '';
}

function openPinPrompt(){
  const ov = document.getElementById('tzOverlay');
  ov.style.display = 'flex';
  ov.innerHTML = '';
  const box = document.createElement('div'); box.className='tzbox';
  box.innerHTML = '<h2>Teacher Zone</h2><label for="tzpin">Enter PIN</label><input id="tzpin" type="password" inputmode="numeric" autocomplete="off">';
  const row = document.createElement('div'); row.className='tzrow';
  const cancel = document.createElement('button'); cancel.className='tzbtn ghost'; cancel.textContent='Cancel'; cancel.onclick=closeTeacherZone;
  const go = document.createElement('button'); go.className='tzbtn primary'; go.textContent='Continue';
  const msg = document.createElement('div'); msg.className='tzmsg';
  go.onclick = async ()=>{
    const pin = box.querySelector('#tzpin').value;
    go.textContent='Checking...'; go.disabled=true;
    try{
      const res = await fetch('/api/words', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({pin, stage:'__check__', topic_slug:'', word_class:'', word:''})});
      if(res.status===401){ msg.className='tzmsg err'; msg.textContent='Incorrect PIN — try again.'; go.textContent='Continue'; go.disabled=false; return; }
      if(res.status===400){ // expected: PIN accepted, the placeholder fields just failed validation
        tzPin = pin;
        openAddWordForm();
        return;
      }
      const data = await res.json().catch(()=>({}));
      msg.className='tzmsg err'; msg.textContent = data.error || 'Something went wrong — is TEACHER_PIN set on the site?';
      go.textContent='Continue'; go.disabled=false;
    } catch(e){
      msg.className='tzmsg err'; msg.textContent="Couldn't reach the teacher zone — check your connection.";
      go.textContent='Continue'; go.disabled=false;
    }
  };
  row.appendChild(cancel); row.appendChild(go);
  box.appendChild(row); box.appendChild(msg);
  ov.appendChild(box);
  box.querySelector('#tzpin').focus();
}

function openAddWordForm(){
  const ov = document.getElementById('tzOverlay');
  ov.innerHTML = '';
  const box = document.createElement('div'); box.className='tzbox';
  box.innerHTML = '<h2>Add a word</h2>';

  const stageSel = document.createElement('select');
  STAGES.forEach(([code,desc])=>{ const o=document.createElement('option'); o.value=code; o.textContent=code+' — '+desc; stageSel.appendChild(o); });
  const topicSel = document.createElement('select');
  const classSel = document.createElement('select');
  const wordInput = document.createElement('input'); wordInput.type='text'; wordInput.placeholder='e.g. shimmering';

  function refreshTopics(){
    topicSel.innerHTML = '';
    tzTopicOptions(stageSel.value).forEach(([slug,[label]])=>{ const o=document.createElement('option'); o.value=slug; o.textContent=label; topicSel.appendChild(o); });
  }
  function refreshClasses(){
    classSel.innerHTML = '';
    tzClassOptions(stageSel.value).forEach(([slug,label])=>{ const o=document.createElement('option'); o.value=slug; o.textContent=label; classSel.appendChild(o); });
  }
  stageSel.onchange = ()=>{ refreshTopics(); refreshClasses(); };
  refreshTopics(); refreshClasses();

  const lab = (t)=>{ const l=document.createElement('label'); l.textContent=t; return l; };
  box.appendChild(lab('Key stage')); box.appendChild(stageSel);
  box.appendChild(lab('Topic')); box.appendChild(topicSel);
  box.appendChild(lab('Word class')); box.appendChild(classSel);
  box.appendChild(lab('Word or phrase')); box.appendChild(wordInput);

  const row = document.createElement('div'); row.className='tzrow';
  const done = document.createElement('button'); done.className='tzbtn ghost'; done.textContent='Done'; done.onclick=closeTeacherZone;
  const add = document.createElement('button'); add.className='tzbtn primary'; add.textContent='Add word';
  const msg = document.createElement('div'); msg.className='tzmsg';

  add.onclick = async ()=>{
    const word = wordInput.value.trim();
    if(!word){ msg.className='tzmsg err'; msg.textContent='Type a word or phrase first.'; return; }
    add.textContent='Adding...'; add.disabled=true;
    try{
      const res = await fetch('/api/words', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
        pin: tzPin, stage: stageSel.value, topic_slug: topicSel.value, word_class: classSel.value, word
      })});
      const data = await res.json();
      if(!res.ok){ msg.className='tzmsg err'; msg.textContent=data.error || 'Something went wrong.'; }
      else {
        msg.className='tzmsg ok'; msg.textContent='Added! Everyone will see it next time they load the page.';
        const stageIdx = STAGES.findIndex(s=>s[0]===stageSel.value);
        const classes = T[topicSel.value][1];
        if(!classes[classSel.value]) classes[classSel.value]=[];
        classes[classSel.value].push([word, stageIdx]);
        wordInput.value='';
        if(state.view==='words' && state.topic===topicSel.value && state.cls===classSel.value) render();
      }
    } catch(e){
      msg.className='tzmsg err'; msg.textContent="Couldn't reach the teacher zone — check your connection.";
    }
    add.textContent='Add word'; add.disabled=false;
  };
  row.appendChild(done); row.appendChild(add);
  box.appendChild(row); box.appendChild(msg);
  ov.appendChild(box);
}

document.getElementById('tzOpen').onclick = openPinPrompt;
document.getElementById('tzOverlay').addEventListener('click', (e)=>{ if(e.target.id==='tzOverlay') closeTeacherZone(); });

loadCustomWords().then(render);
render();
</script>
